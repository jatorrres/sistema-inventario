<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar producto</title>
    <link rel="stylesheet" th:href="@{/CSS/estilos.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
    <header>
        <h1>Sistema de Inventario</h1>
        <p>Registro de productos</p>
    </header>

     <nav class="navbar navbar-expand-lg bg-dark navbar-dark shadow-sm mb-4">
        <div class="container">
            <button class="navbar-toggler ms-auto" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav nav-fill w-100 align-items-center">
                    <li class="nav-item">
                        <a class="nav-link text-white fw-bold active" th:href="@{/}">Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white" th:href="@{/Productos.html}">Productos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white" th:href="@{/registrar}">Registrar Producto</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container mt-4">
        <section>
            <h2>Registrar Nuevo Producto</h2>
            <form id="formProducto">
                <div class="mb-3">
                    <label for="codigo" class="form-label">Código</label>
                    <input type="text" class="form-control" id="codigo" name="codigo" placeholder="Ejemplo: P001" required>
                </div>
                <div class="mb-3">
                    <label for="nombre" class="form-label">Nombre del producto</label>
                    <input type="text" class="form-control" id="nombre" name="nombre" placeholder="Ejemplo: Teclado" required>
                </div>
                <div class="mb-3">
                    <label for="categoria" class="form-label">Categoría</label>
                    <select class="form-select" id="categoria" name="categoria" required>
                        <option value="">Seleccione</option>
                        <option>Tecnología</option>
                        <option>Papelería</option>
                        <option>Accesorios</option>
                    </select>
                </div>
                
                <div class="mb-3">
                    <label for="precio" class="form-label">Precio</label>
                    <div class="input-group">
                        <span class="input-group-text">$</span>
                        <input type="number" class="form-control" id="precio" name="precio" placeholder="10000" required min="1">
                    </div>
                </div>
                <div class="mb-3">
                    <label for="cantidad" class="form-label">Cantidad</label>
                    <input type="number" class="form-control" id="cantidad" name="cantidad" placeholder="Ejemplo: 15" required min="0">
                </div>

               
                <div class="mb-3">
                    <label for="stockMinimo" class="form-label">Stock Mínimo</label>
                    <input type="number" class="form-control" id="stockMinimo" name="stockMinimo" placeholder="Ejemplo: 5" required min="0">
                </div>

              
                <div id="mensaje" class="mt-3"></div>
                
                <button type="submit" class="btn btn-success">Guardar producto</button>
                <button type="reset" class="btn btn-danger">Limpiar formulario</button>
                
            </form>
        </section>
    </main>

    <footer class="mt-5 text-center">
        <p>Sistema Web de Inventario<br>Tecnólogo en Análisis y Desarrollo de Software</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="js/app.js"></script>
</body>
</html>
